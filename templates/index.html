<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Email Extractor</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f4f6f9; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
        .container { background: #ffffff; width: 100%; max-width: 650px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1a202c; }
        p { color: #718096; margin-bottom: 24px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 15px; outline: none; }
        input[type="text"]:focus { border-color: #3182ce; }
        button { background: #3182ce; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background: #2b6cb0; }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 14px; font-weight: 500; }
        .error { color: #e53e3e; }
        .results-box { margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 20px; display: none; }
        ul { list-style: none; padding: 0; margin: 10px 0 0 0; max-height: 250px; overflow-y: auto; border: 1px solid #edf2f7; border-radius: 8px; }
        li { padding: 10px 14px; border-bottom: 1px solid #edf2f7; font-family: monospace; color: #2d3748; }
        li:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>University Email Extractor</h2>
        <p>Paste a university department link below to scan for public email addresses.</p>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="e.g., https://cs.university.edu/faculty">
            <button id="scrapeBtn" onclick="runScraper()">Extract Emails</button>
        </div>

        <div id="statusMessage" class="status"></div>

        <div id="resultsBox" class="results-box">
            <strong id="resultCount"></strong>
            <ul id="emailList"></ul>
        </div>
    </div>

    <script>
        async function runScraper() {
            const urlInput = document.getElementById("urlInput");
            const scrapeBtn = document.getElementById("scrapeBtn");
            const statusMessage = document.getElementById("statusMessage");
            const resultsBox = document.getElementById("resultsBox");
            const emailList = document.getElementById("emailList");
            const resultCount = document.getElementById("resultCount");

            const targetUrl = urlInput.value.trim();
            if (!targetUrl) {
                statusMessage.className = "status error";
                statusMessage.innerText = "Please enter a valid URL.";
                return;
            }

            // Reset UI State
            statusMessage.className = "status";
            statusMessage.innerText = "Scanning website for emails...";
            resultsBox.style.display = "none";
            emailList.innerHTML = "";
            scrapeBtn.disabled = true;

            try {
                const response = await fetch("/api/scrape", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: targetUrl })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "An unknown error occurred.");
                }

                statusMessage.innerText = "";
                resultsBox.style.display = "block";
                resultCount.innerText = `Found ${data.count} unique email address(es):`;

                if (data.emails.length === 0) {
                    emailList.innerHTML = "<li>No emails found on this page.</li>";
                } else {
                    data.emails.forEach(email => {
                        const li = document.createElement("li");
                        li.innerText = email;
                        emailList.appendChild(li);
                    });
                }
            } catch (err) {
                statusMessage.className = "status error";
                statusMessage.innerText = err.message;
            } finally {
                scrapeBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
